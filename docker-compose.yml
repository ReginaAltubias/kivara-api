services:
  # =========================================================================
  # PostgreSQL Database (Primary Data Store)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: kivara-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kivara}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kivara-network
    restart: unless-stopped

  # =========================================================================
  # pgAdmin (PostgreSQL Database Management)
  # =========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kivara-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kivara.ao
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kivara-network
    restart: unless-stopped

  # =========================================================================
  # Redis (Cache, Sessions, Queues, In-Memory Scoring)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: kivara-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kivara-network
    restart: unless-stopped

  # =========================================================================
  # Laravel API Web Server (Octane + Swoole)
  # =========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    container_name: kivara-web

    environment:
      APP_NAME: "Kivara"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY:-}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-kivara}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/node_modules
      - /app/vendor
      - app_storage:/app/storage

    networks:
      - kivara-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =========================================================================
  # Queue Worker (Background Jobs Processing)
  # =========================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    container_name: kivara-worker

    environment:
      APP_NAME: "Kivara"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-kivara}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      REDIS_HOST: redis
      REDIS_PORT: 6379

    command: bash -c "php artisan migrate --force && php artisan queue:work redis --delay=3 --sleep=3 --tries=3"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/vendor
      - app_storage:/app/storage

    networks:
      - kivara-network

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

volumes:
  postgres_data:
    driver: local

  redis_data:
    driver: local

  app_storage:
    driver: local

  pgadmin_data:
    driver: local

networks:
  kivara-network:
    driver: bridge
