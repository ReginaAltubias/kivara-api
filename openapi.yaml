                  message: { type: string, example: 'Lições obtidas com sucesso.' }
                  data: { type: array, items: { $ref: '#/components/schemas/Lesson' } }
        401:
          description: 'Não autenticado (Token inválido ou ausente).'
          content:
            application/json:
