components:
  securitySchemes:
    sanctumAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token Sanctum Bearer gerado no login ou verificação de conta'
  schemas:
    StandardSuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: 'Operação executada com sucesso.'
        data:
          type: object
          description: 'Objeto de dados ou lista retornada'
    ValidationErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: 'Os dados fornecidos são inválidos.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - 'O campo email é obrigatório.'
              - 'O email deve ser um endereço válido.'
            amount:
              - 'O montante deve ser superior a zero.'
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: 'Mensagem descritiva do erro.'
        error_code:
          type: string
          example: RESOURCE_NOT_FOUND
    User:
      type: object
      properties:
        id:
