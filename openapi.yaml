openapi: 3.0.3
info:
  title: 'KIVARA API'
  description: |-
    Documentação Oficial da API KIVARA (v1).

    Implementa um ecossistema Multi-Tenant B2B2C completo:
    - **Motor Financeiro & Double-Entry Ledger Imutável**
    - **Parent Gate & Gestão Familiar (Mesadas e Tarefas)**
    - **Motor Educacional & RPG (Trilhas, Lições, Cofres e Badges)**
    - **Gestão B2B para Escolas e Professores**
    - **Módulo B2B para Parceiros & Patrocinadores**
    - **Administração Central, Auditoria e Compliance**

    Todos os esquemas contêm modelos JSON interativos e exemplos de payloads prontos para teste.
  version: 1.0.0
  contact:
    name: 'KIVARA Engineering Team'
    email: api@kivara.ao
    url: 'https://kivara.ao'
servers:
  -
    url: 'http://localhost:8000/api/v1'
    description: 'Ambiente de Desenvolvimento Local (v1)'
  -
    url: 'https://api.kivara.ao/api/v1'
    description: 'Ambiente de Produção (v1)'
tags:
  -
    name: 'Autenticação & Contas'
    description: 'Fluxos de Login, Registo, Ativação OTP e Gestão de Credenciais'
  -
    name: 'Motor Financeiro & Saldos'
    description: 'Cofres dos Sonhos, Wallets, Transações e Ledger Imutável'
  -
    name: 'Família, Mesadas & Parent Gate'
    description: 'Controlo Parental, Mesadas Periódicas e Tarefas com Recompensas'
  -
    name: 'Motor Educacional & RPG'
    description: 'Trilhas Pedagógicas, Lições Gamificadas, Badges, Streaks e XP'
  -
    name: 'B2B - Escolas & Professores'
    description: 'Gestão de Turmas, Avaliações Práticas, Alunos e Métricas Escolares'
  -
    name: 'B2B - Parceiros & Patrocinadores'
    description: 'Programas de Incentivo, Bolsas e Desafios Inter-Escolares'
  -
    name: 'Administração Central'
    description: 'Gestão de Tenants, Planos, Banners, Compliance e Auditoria'
  -
    name: Geral
    description: 'Outros endpoints da plataforma'
paths:
  /admin/audit-logs:
    get:
      tags:
        - 'Administração Central'
      summary: 'Listar Logs de Auditoria do Sistema'
      description: 'Operação GET em `/admin/audit-logs` executada por `App\Http\Controllers\Api\Admin\AdminAuditController@index`.'
      responses:
        200:
          description: 'Operação realizada com sucesso.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Logs de auditoria recuperados com sucesso.' }
                  data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        401:
          description: 'Não autenticado (Token inválido ou ausente).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: 'Acesso não autorizado para o perfil do utilizador.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        422:
          description: 'Erro de validação nos dados enviados.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      security:
        -
          sanctumAuth: {  }
  /admin/compliance/stats:
    get:
      tags:
        - 'Administração Central'
      summary: 'Consultar Métricas de Compliance e Risco Regulatório'
      description: 'Operação GET em `/admin/compliance/stats` executada por `App\Http\Controllers\Api\Admin\AdminComplianceController@stats`.'
      responses:
        200:
          description: 'Operação realizada com sucesso.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Métricas de compliance obtidas com sucesso.' }
                  data: { type: object, properties: { kyc_verified_percentage: { type: number, example: 98.5 }, pending_compliance_reviews: { type: integer, example: 3 }, high_risk_alerts_count: { type: integer, example: 0 }, total_transactions_audited: { type: integer, example: 45890 }, last_audit_run_at: { type: string, format: date-time, example: '2026-08-27T04:00:00Z' } } }
        401:
          description: 'Não autenticado (Token inválido ou ausente).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: 'Acesso não autorizado para o perfil do utilizador.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        422:
          description: 'Erro de validação nos dados enviados.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      security:
        -
          sanctumAuth: {  }
  /admin/lessons:
    get:
      tags:
        - 'Administração Central'
      summary: 'Listar Lições Educativas'
      description: 'Operação GET em `/admin/lessons` executada por `App\Http\Controllers\Api\Admin\AdminLessonController@index`.'
