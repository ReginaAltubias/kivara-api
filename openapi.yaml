                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: 'Acesso não autorizado para o perfil do utilizador.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        422:
          description: 'Erro de validação nos dados enviados.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      security:
        -
          sanctumAuth: {  }
    post:
      tags:
        - 'Administração Central'
      summary: 'Criar Nova Lição Educativa'
      description: 'Operação POST em `/admin/lessons` executada por `App\Http\Controllers\Api\Admin\AdminLessonController@store`.'
      responses:
        200:
          description: 'Operação realizada com sucesso.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Lição criada com sucesso.' }
                  data: { $ref: '#/components/schemas/Lesson' }
        401:
          description: 'Não autenticado (Token inválido ou ausente).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: 'Acesso não autorizado para o perfil do utilizador.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        422:
          description: 'Erro de validação nos dados enviados.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        201:
          description: 'Recurso criado com sucesso.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Lição criada com sucesso.' }
                  data: { $ref: '#/components/schemas/Lesson' }
      security:
        -
          sanctumAuth: {  }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trail_id
                - title
                - type
                - xp_reward
              properties:
                trail_id:
                  type: string
                  format: uuid
                  example: trail-9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                title:
                  type: string
                  example: 'Entendendo Juros e Investimentos'
                description:
                  type: string
                  example: 'Como o dinheiro trabalha para ti através dos juros compostos.'
                module_number:
                  type: integer
                  example: 2
                order:
                  type: integer
                  example: 3
                duration_minutes:
                  type: integer
                  example: 20
                xp_reward:
                  type: integer
                  example: 150
                coins_reward:
                  type: number
                  format: float
                  example: 100.0
                type:
                  type: string
                  enum: [video, quiz, practical, story]
                  example: quiz
